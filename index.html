<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Navegador libre con mapas de OpenStreetMap, sin servicios de Google.">
  <title>RutaLibre</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="lib/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-view="explore">
  <div id="map"></div>
  <div id="top"></div>
  <div id="banner" hidden></div>
  <div id="fabs"></div>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="overlay" hidden></div>

  <script src="lib/maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
